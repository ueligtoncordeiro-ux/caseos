version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rccs:rccs@postgres:5432/rccs
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docx_output:/app/docx_output
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rccs
      POSTGRES_PASSWORD: rccs
      POSTGRES_DB: rccs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rccs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
