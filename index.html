<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CaseOS — Relatos Clínicos com IA</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0A0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CaseOS">
<link rel="apple-touch-icon" href="/assets/logo-caseos.png">
<style>
  body { margin: 0; background: #0A0A0B; display: flex; align-items: center;
         justify-content: center; height: 100vh; font-family: Inter, sans-serif; }
  .loader { width: 36px; height: 36px; border: 3px solid #1C1C1E;
            border-top-color: #C8FF00; border-radius: 50%;
            animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader" aria-label="Carregando…"></div>
<script>
/**
 * index.html — roteador de entrada do CaseOS
 *
 * Autenticado  (rccs_token presente em sessionStorage) → dashboard.html
 * Anônimo                                               → landing.html
 *
 * Não faz chamada de rede: apenas lê o token local para decidir
 * o destino imediato. O dashboard valida o token com o backend.
 */
(function () {
  // reviewstudio.voandonaia.com → sempre vai direto para o Review Studio
  if (window.location.hostname === 'reviewstudio.voandonaia.com') {
    window.location.replace('/review-studio');
    return;
  }

  // caseos.voandonaia.com e localhost → roteador normal
  var token = sessionStorage.getItem('rccs_token');
  if (token && token.length > 10) {
    window.location.replace('dashboard.html');
  } else {
    window.location.replace('landing.html');
  }
})();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})</script>
</body>
</html>
