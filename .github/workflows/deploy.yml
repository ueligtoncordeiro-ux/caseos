name: Deploy - Render

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI — Lint & Test"]
    branches: [main]
    types: [completed]

jobs:
  deploy-render:
    name: Trigger Render deploy hook
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Check Render deploy hook
        id: render-hook
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            {
              echo "### Render deploy skipped"
              echo ""
              echo "Set the GitHub secret \`RENDER_DEPLOY_HOOK_URL\` with the Deploy Hook URL from the Render service."
              echo "The old Railway deploy path has been removed from this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: steps.render-hook.outputs.configured == 'true'
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
          {
            echo "### Render deploy requested"
            echo ""
            echo "Render accepted the deploy hook request for this repository."
          } >> "$GITHUB_STEP_SUMMARY"
