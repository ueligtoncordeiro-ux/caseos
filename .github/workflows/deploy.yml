name: Deploy — Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy backend to Railway
        run: |
          cd backend
          railway up --service caseos-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Railway project: ea547634-f587-4572-883f-a3032a419c12 (caseos)
          # Service:         c164deaa-4573-4e8e-bf4d-ae8c66fa2fdb (caseos-api)
          # Environment:     fc4955cc-35b5-4829-8017-b46b59dd1aa9 (production)
