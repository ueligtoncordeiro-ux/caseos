<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 40" width="24" height="40" shape-rendering="crispEdges">
  <!-- Nose cone (top) -->
  <rect x="10" y="0"  width="4" height="2" fill="#cc0000"/>
  <rect x="8"  y="2"  width="8" height="2" fill="#dd0000"/>
  <rect x="7"  y="4"  width="10" height="2" fill="#ee1111"/>

  <!-- Body (white) -->
  <rect x="5"  y="6"  width="14" height="18" fill="#ffffff"/>
  <rect x="6"  y="6"  width="12" height="18" fill="#f5f5f5"/>

  <!-- Window -->
  <rect x="8"  y="10" width="8" height="8"  fill="#1177cc"/>
  <rect x="9"  y="11" width="6" height="6"  fill="#2299ee"/>
  <rect x="10" y="12" width="4" height="4"  fill="#44aaff"/>
  <rect x="10" y="12" width="2" height="2"  fill="#99ddff"/>

  <!-- Left wing -->
  <rect x="1"  y="16" width="4" height="6"  fill="#cc0000"/>
  <rect x="0"  y="18" width="2" height="4"  fill="#aa0000"/>

  <!-- Right wing -->
  <rect x="19" y="16" width="4" height="6"  fill="#cc0000"/>
  <rect x="22" y="18" width="2" height="4"  fill="#aa0000"/>

  <!-- Engine base -->
  <rect x="7"  y="24" width="10" height="3" fill="#bb0000"/>
  <rect x="8"  y="27" width="8"  height="2" fill="#880000"/>

  <!-- Flame outer -->
  <rect x="8"  y="29" width="8"  height="4" fill="#ff6600"/>
  <rect x="9"  y="33" width="6"  height="3" fill="#ffaa00"/>
  <rect x="10" y="36" width="4"  height="3" fill="#ffdd00"/>
  <rect x="11" y="39" width="2"  height="1" fill="#ffffff"/>

  <!-- Flame shimmer highlight -->
  <rect x="11" y="29" width="2"  height="3" fill="#ffaa44"/>
</svg>
